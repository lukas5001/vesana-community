name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: [self-hosted, linux, x64, vesana-vps]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: community
          POSTGRES_PASSWORD: community
          POSTGRES_DB: community
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U community -d community"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL_TEST: postgresql+psycopg://community:community@localhost:55432/community

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 🔒 Eigene venv je Lauf: der self-hosted vesana-vps-Runner teilt den
      # Python-Toolcache mit den Vesana-Runnern. Ein `pip install` direkt in
      # den Toolcache mischt sich mit parallelen Jobs (fremde Paketversionen,
      # fehlende Module wie pydantic_settings trotz grünem Install). Siehe
      # gleiches Muster in Vesana/.github/workflows/ci.yml.
      - name: Python-venv je Lauf
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: pytest
        run: pytest -q
